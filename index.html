<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Dis-Bot | لوحة التحكم</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07080d;--card:#12141d;--card2:#1a1d29;--border:#22263a;
  --text:#fff;--muted:#8a90a8;--primary:#5865F2;--primary2:#4752C4;
  --green:#57F287;--red:#ED4245;--yellow:#FEE75C;--pink:#EB459E;
  --radius:14px;--radius-sm:10px;
}
html,body{overflow-x:hidden;width:100%}
body{
  font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  background-image:
    radial-gradient(circle at 15% 20%,rgba(88,101,242,.12) 0%,transparent 45%),
    radial-gradient(circle at 85% 80%,rgba(235,69,158,.08) 0%,transparent 45%);
  -webkit-font-smoothing:antialiased;
}
svg{display:block;width:100%;height:100%}
.icon{width:20px;height:20px;flex-shrink:0;fill:currentColor}

/* ========== 3D LOADER ========== */
#loader{
  position:fixed;inset:0;background:#07080d;z-index:9999;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  perspective:1000px;transition:opacity .8s,visibility .8s;
}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.loader-scene{width:150px;height:150px;position:relative;transform-style:preserve-3d;animation:spin 4s infinite linear}
@keyframes spin{0%{transform:rotateX(15deg) rotateY(0)}100%{transform:rotateX(15deg) rotateY(360deg)}}
.cube{position:absolute;width:100px;height:100px;top:25px;left:25px;transform-style:preserve-3d}
.cube-face{
  position:absolute;width:100px;height:100px;
  background:linear-gradient(135deg,rgba(88,101,242,.85),rgba(235,69,158,.85));
  border:2px solid rgba(255,255,255,.3);border-radius:14px;
  box-shadow:0 0 30px rgba(88,101,242,.7),inset 0 0 20px rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;font-size:42px;
}
.cube-face:nth-child(1){transform:translateZ(50px)}
.cube-face:nth-child(2){transform:rotateY(180deg) translateZ(50px)}
.cube-face:nth-child(3){transform:rotateY(90deg) translateZ(50px)}
.cube-face:nth-child(4){transform:rotateY(-90deg) translateZ(50px)}
.cube-face:nth-child(5){transform:rotateX(90deg) translateZ(50px)}
.cube-face:nth-child(6){transform:rotateX(-90deg) translateZ(50px)}
.loader-title{
  margin-top:50px;font-size:28px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(135deg,#5865F2,#EB459E,#57F287);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;background-size:200% 200%;animation:gradient 2s infinite;
}
@keyframes gradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.loader-sub{color:var(--muted);margin-top:8px;font-size:13px}
.loader-bar{width:220px;height:3px;background:#1a1d29;border-radius:3px;margin-top:25px;overflow:hidden}
.loader-bar::after{content:'';display:block;height:100%;width:0;
  background:linear-gradient(90deg,#5865F2,#EB459E);animation:load 5s forwards}
@keyframes load{to{width:100%}}
.particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.particle{position:absolute;width:3px;height:3px;border-radius:50%;animation:float 8s infinite;opacity:.6}
@keyframes float{
  0%{transform:translateY(100vh) scale(0);opacity:0}
  10%{opacity:.8}
  90%{opacity:.8}
  100%{transform:translateY(-10vh) scale(1.5);opacity:0}
}

/* ========== PAGE TRANSITIONS ========== */
.page{display:none}
.page.active{display:block;animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

/* ========== LAYOUT ========== */
.container{max-width:1150px;margin:0 auto;padding:16px}

/* ========== TOPBAR ========== */
.topbar{
  position:sticky;top:0;z-index:100;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  background:rgba(7,8,13,.8);border-bottom:1px solid var(--border);
  padding:10px 16px;display:flex;justify-content:space-between;align-items:center;
}
.topbar-logo{font-weight:900;font-size:18px;
  background:linear-gradient(135deg,#5865F2,#EB459E);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  display:flex;align-items:center;gap:8px;
}
.topbar-logo svg{width:26px;height:26px;fill:url(#logoGradient)}
.profile-wrap{position:relative}
.profile-pic{
  width:38px;height:38px;border-radius:50%;border:2px solid var(--primary);
  cursor:pointer;transition:.25s;object-fit:cover;
}
.profile-pic:hover{transform:scale(1.08);border-color:var(--pink)}
.profile-menu{
  position:absolute;top:52px;left:0;background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:8px;min-width:180px;display:none;z-index:200;
  box-shadow:0 10px 40px rgba(0,0,0,.6);
}
.profile-menu.show{display:block;animation:fadeIn .2s}
.profile-menu-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
  cursor:pointer;font-size:14px;transition:.2s;
}
.profile-menu-item:hover{background:var(--card2)}
.profile-menu-name{padding:10px 12px;border-bottom:1px solid var(--border);margin-bottom:6px}
.profile-menu-name div:first-child{font-weight:700;font-size:14px}
.profile-menu-name div:last-child{color:var(--muted);font-size:12px;margin-top:2px}

/* ========== BUTTONS ========== */
button{
  background:linear-gradient(135deg,#5865F2,#4752C4);color:#fff;border:none;
  padding:11px 20px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:700;
  transition:all .25s;font-family:inherit;
  box-shadow:0 4px 15px rgba(88,101,242,.3);
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
}
button:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(88,101,242,.5)}
button:active{transform:translateY(0)}
button.sec{background:var(--card2);color:#fff;box-shadow:none;border:1px solid var(--border)}
button.sec:hover{background:#252938}
button.danger{background:linear-gradient(135deg,#ED4245,#c73a3d)}
button.success{background:linear-gradient(135deg,#57F287,#3ba55d);color:#000}
button.pink{background:linear-gradient(135deg,#EB459E,#c93680)}
button.small{padding:7px 12px;font-size:13px}

/* ========== CARDS ========== */
.card{
  background:linear-gradient(135deg,rgba(18,20,29,.95),rgba(26,29,41,.95));
  border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin:12px 0;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:all .3s;
}
.card:hover{border-color:rgba(88,101,242,.4)}
.card-title{font-size:17px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.card-title svg{width:20px;height:20px;fill:var(--primary)}

/* ========== INPUTS ========== */
input,select,textarea{
  background:var(--card2);color:#fff;border:1px solid var(--border);
  padding:11px 13px;border-radius:10px;width:100%;font-size:14px;font-family:inherit;
  transition:.2s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(88,101,242,.15)}
textarea{min-height:85px;resize:vertical}
label{display:block;margin:12px 0 6px;font-size:13px;color:var(--muted);font-weight:600}
input[type="color"]{height:46px;padding:4px;cursor:pointer}

/* ========== SWITCH ========== */
.switch{display:inline-flex;align-items:center;gap:12px;cursor:pointer;padding:6px 0;user-select:none;font-size:14px}
.switch input{display:none}
.switch-slider{
  width:44px;height:24px;background:var(--border);border-radius:20px;position:relative;
  transition:.3s;flex-shrink:0;
}
.switch-slider::before{
  content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;
  top:3px;right:3px;transition:.3s;
}
.switch input:checked + .switch-slider{background:linear-gradient(135deg,#5865F2,#4752C4)}
.switch input:checked + .switch-slider::before{transform:translateX(-20px)}

/* ========== HERO ========== */
.hero{
  text-align:center;padding:50px 20px;
  background:linear-gradient(135deg,rgba(88,101,242,.1),rgba(235,69,158,.05));
  border-radius:20px;margin:16px 0;border:1px solid var(--border);
  position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle,rgba(88,101,242,.12),transparent 40%);
  animation:rotate 20s infinite linear;pointer-events:none;
}
@keyframes rotate{to{transform:rotate(360deg)}}
.hero h1{font-size:clamp(26px,6vw,44px);font-weight:900;margin-bottom:12px;
  background:linear-gradient(135deg,#5865F2,#EB459E,#57F287);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  background-size:200% 200%;animation:gradient 3s infinite;position:relative;
}
.hero p{color:var(--muted);font-size:15px;max-width:600px;margin:0 auto 24px;position:relative;line-height:1.7}
.hero-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;position:relative}

/* ========== STATS ========== */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}
.stat-card{
  background:linear-gradient(135deg,rgba(88,101,242,.1),rgba(235,69,158,.05));
  border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;
  transition:all .3s;
}
.stat-card:hover{transform:translateY(-4px);border-color:var(--primary)}
.stat-num{font-size:26px;font-weight:900;
  background:linear-gradient(135deg,#5865F2,#EB459E);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.stat-label{font-size:12px;color:var(--muted);margin-top:4px}

/* ========== FEATURES ========== */
.feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.feature{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;
  transition:all .3s;position:relative;overflow:hidden;
}
.feature:hover{transform:translateY(-4px);border-color:var(--primary);
  box-shadow:0 15px 40px rgba(88,101,242,.2)}
.feature::before{
  content:'';position:absolute;top:0;right:0;width:100%;height:3px;
  background:linear-gradient(90deg,#5865F2,#EB459E,#57F287);
  transform:translateX(-100%);transition:.5s;
}
.feature:hover::before{transform:translateX(0)}
.feature-icon{
  width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,rgba(88,101,242,.2),rgba(235,69,158,.1));
  margin-bottom:10px;
}
.feature-icon svg{width:22px;height:22px;fill:var(--primary)}
.feature-title{font-weight:800;margin-bottom:6px;font-size:14px}
.feature-desc{color:var(--muted);font-size:13px;line-height:1.6}

/* ========== UPDATES ========== */
.update-item{
  display:flex;gap:10px;padding:12px;border-radius:10px;background:var(--card2);
  margin:6px 0;border-right:3px solid var(--primary);transition:.2s;
}
.update-item:hover{transform:translateX(-4px);background:#1f2330}
.update-badge{
  background:linear-gradient(135deg,#5865F2,#4752C4);color:#fff;
  padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;
  height:fit-content;white-space:nowrap;
}
.update-text{flex:1;font-size:13px}
.update-time{font-size:11px;color:var(--muted);margin-top:4px}

/* ========== GUILDS ========== */
.guild-card{
  display:flex;align-items:center;gap:14px;padding:14px;
  background:var(--card2);border-radius:var(--radius);cursor:pointer;margin:8px 0;
  transition:all .3s;border:1px solid transparent;
}
.guild-card:hover{background:#252938;border-color:var(--primary);transform:translateX(-4px)}
.guild-icon{width:48px;height:48px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;object-fit:cover}
.guild-info{flex:1;min-width:0}
.guild-name{font-weight:800;font-size:15px;margin-bottom:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.guild-members{color:var(--muted);font-size:12px}
.guild-badge{background:var(--primary);color:#fff;padding:3px 10px;border-radius:20px;
  font-size:10px;font-weight:700}

/* ========== TABS ========== */
.tabs{
  display:flex;gap:6px;margin:16px 0;overflow-x:auto;padding-bottom:6px;
  scrollbar-width:thin;-webkit-overflow-scrolling:touch;
}
.tabs::-webkit-scrollbar{height:5px}
.tabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.tab{
  padding:9px 14px;background:var(--card2);border-radius:10px;cursor:pointer;
  border:1px solid var(--border);color:var(--muted);white-space:nowrap;
  font-size:13px;font-weight:700;transition:.25s;
  display:inline-flex;align-items:center;gap:6px;flex-shrink:0;
}
.tab svg{width:16px;height:16px;fill:currentColor}
.tab:hover{color:#fff;border-color:var(--primary)}
.tab.active{background:linear-gradient(135deg,#5865F2,#4752C4);color:#fff;
  border-color:transparent;box-shadow:0 4px 15px rgba(88,101,242,.4)}

/* ========== AUTO-REPLIES ========== */
.reply-item{
  display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:center;
  background:var(--card2);padding:8px;border-radius:10px;margin:6px 0;
}
.reply-item input{padding:8px 11px;font-size:13px}
.reply-item .switch{padding:0}

/* ========== TOAST ========== */
.toast{
  position:fixed;bottom:20px;left:20px;background:var(--green);color:#000;
  padding:12px 18px;border-radius:12px;font-weight:700;display:none;z-index:1000;
  box-shadow:0 10px 30px rgba(87,242,135,.4);font-size:14px;
  display:none;align-items:center;gap:8px;max-width:90%;
}
.toast.show{display:flex;animation:slideIn .3s}
.toast.err{background:var(--red);color:#fff}
.toast.info{background:var(--primary);color:#fff}
@keyframes slideIn{from{transform:translateX(-100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ========== MISC ========== */
.spinner{
  width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);
  border-radius:50%;animation:spin2 1s linear infinite;margin:0 auto 12px;
}
@keyframes spin2{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-state-icon{
  width:70px;height:70px;margin:0 auto 16px;border-radius:50%;
  background:var(--card2);display:flex;align-items:center;justify-content:center;
}
.empty-state-icon svg{width:36px;height:36px;fill:var(--muted)}
.empty-state h3{margin-bottom:8px;color:#fff;font-size:16px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;
  font-weight:700;margin-right:4px}
.badge.green{background:rgba(87,242,135,.15);color:var(--green)}
.badge.red{background:rgba(237,66,69,.15);color:var(--red)}
.badge.yellow{background:rgba(254,231,92,.15);color:var(--yellow)}

/* ========== AVATAR UPLOAD ========== */
.avatar-upload{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px}
.avatar-preview{
  width:100px;height:100px;border-radius:50%;border:3px solid var(--primary);
  object-fit:cover;background:var(--card2);
}
.upload-label{
  background:var(--card2);border:2px dashed var(--border);border-radius:var(--radius);
  padding:20px;text-align:center;cursor:pointer;transition:.2s;width:100%;
}
.upload-label:hover{border-color:var(--primary);background:#1f2330}
.upload-label input{display:none}
.upload-label-text{font-size:13px;color:var(--muted);margin-top:6px}

/* ========== RESPONSIVE ========== */

/* === Mobile (default above covers) === */
@media(max-width:600px){
  .container{padding:12px}
  .topbar{padding:8px 12px}
  .topbar-logo{font-size:16px}
  .topbar-logo svg{width:22px;height:22px}
  .profile-pic{width:34px;height:34px}
  .card{padding:16px;border-radius:12px}
  .hero{padding:36px 16px;border-radius:16px}
  .hero p{font-size:14px}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-num{font-size:22px}
  .feature-grid{grid-template-columns:1fr}
  .tab{padding:8px 12px;font-size:12px}
  .tab svg{width:14px;height:14px}
  button{padding:10px 16px;font-size:13px}
  .reply-item{grid-template-columns:1fr 1fr;gap:6px}
  .toast{left:12px;right:12px;bottom:12px;font-size:13px}
  .guild-icon{width:44px;height:44px}
  .guild-name{font-size:14px}
}

/* === Tablet === */
@media(min-width:601px) and (max-width:1024px){
  .container{max-width:900px;padding:18px}
  .feature-grid{grid-template-columns:repeat(2,1fr)}
  .stats-grid{grid-template-columns:repeat(3,1fr)}
  .hero{padding:50px 30px}
}

/* === Desktop === */
@media(min-width:1025px){
  .container{max-width:1150px}
  .feature-grid{grid-template-columns:repeat(3,1fr)}
  .stats-grid{grid-template-columns:repeat(4,1fr)}
  .hero{padding:70px 40px}
  .hero h1{font-size:52px}
  .card{padding:24px}
  .topbar{padding:14px 24px}
  .profile-pic{width:40px;height:40px}
}

/* === Large Desktop === */
@media(min-width:1440px){
  .container{max-width:1280px}
  .feature-grid{grid-template-columns:repeat(4,1fr)}
}

/* === Landscape Phone === */
@media(max-height:500px) and (orientation:landscape){
  .hero{padding:30px 20px}
  .hero h1{font-size:28px}
  #loader .loader-scene{width:100px;height:100px}
  #loader .cube{width:70px;height:70px;top:15px;left:15px}
  #loader .cube-face{width:70px;height:70px;font-size:28px}
  #loader .cube-face:nth-child(1){transform:translateZ(35px)}
  #loader .cube-face:nth-child(2){transform:rotateY(180deg) translateZ(35px)}
  #loader .cube-face:nth-child(3){transform:rotateY(90deg) translateZ(35px)}
  #loader .cube-face:nth-child(4){transform:rotateY(-90deg) translateZ(35px)}
  #loader .cube-face:nth-child(5){transform:rotateX(90deg) translateZ(35px)}
  #loader .cube-face:nth-child(6){transform:rotateX(-90deg) translateZ(35px)}
  #loader .loader-title{font-size:22px;margin-top:30px}
}
</style>
</head>
<body>

<svg style="position:absolute;width:0;height:0" aria-hidden="true">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#EB459E"/>
    </linearGradient>
  </defs>
</svg>

<!-- ========== LOADER ========== -->
<div id="loader">
  <div class="particles" id="particles"></div>
  <div class="loader-scene">
    <div class="cube">
      <div class="cube-face">🤖</div>
      <div class="cube-face">⚡</div>
      <div class="cube-face">🎮</div>
      <div class="cube-face">💎</div>
      <div class="cube-face">🚀</div>
      <div class="cube-face">⭐</div>
    </div>
  </div>
  <div class="loader-title">DIS-BOT</div>
  <div class="loader-sub">جاري التحميل...</div>
  <div class="loader-bar"></div>
</div>

<!-- ========== TOPBAR ========== -->
<div class="topbar" id="topbar" style="display:none">
  <div class="topbar-logo" onclick="renderLanding()">
    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    DIS-BOT
  </div>
  <div id="topbar-right"></div>
</div>

<div class="container" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const API = 'https://dis-bot-qf91.onrender.com';
const INVITE_URL = 'https://discord.com/api/oauth2/authorize?client_id=1554518924006129896&permissions=8&scope=bot%20applications.commands';

// ===== PARTICLES =====
(function(){
  const p = document.getElementById('particles');
  for (let i = 0; i < 25; i++) {
    const el = document.createElement('div');
    el.className = 'particle';
    el.style.left = Math.random()*100 + '%';
    el.style.animationDelay = Math.random()*8 + 's';
    el.style.animationDuration = (6 + Math.random()*6) + 's';
    el.style.background = ['#5865F2','#EB459E','#57F287','#FEE75C'][Math.floor(Math.random()*4)];
    p.appendChild(el);
  }
})();

// ===== LOADER =====
setTimeout(() => {
  document.getElementById('loader').classList.add('hide');
  document.getElementById('topbar').style.display = 'flex';
  init();
}, 5000);

// ===== STATE =====
const state = {
  token: null, user: null, guilds: [], currentGuild: null,
  config: null, channels: [], categories: [], roles: [], botInfo: null,
  botAvatarFile: null, botAvatarData: null,
};

const urlParams = new URLSearchParams(location.search);
if (urlParams.get('token')) {
  localStorage.setItem('token', urlParams.get('token'));
  history.replaceState({}, '', location.pathname);
}
state.token = localStorage.getItem('token');

// ===== API =====
async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      ...(opts.body instanceof FormData ? {} : {'Content-Type':'application/json'}),
      ...(state.token ? { Authorization: 'Bearer ' + state.token } : {}),
      ...(opts.headers || {}),
    },
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'خطأ');
  return res.json();
}

// ===== TOAST =====
function toast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (type === 'err' ? ' err' : type === 'info' ? ' info' : '');
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ===== INIT =====
async function init() {
  try { state.botInfo = await api('/'); } catch {}
  renderTopbar();
  if (!state.token) return renderLanding();
  try {
    state.user = await api('/api/me');
    state.guilds = await api('/api/guilds');
    renderTopbar();
    renderLanding();
  } catch {
    localStorage.removeItem('token');
    state.token = null;
    renderLanding();
  }
}

    <div class="card">
      <div class="card-title">🎫 نظام التكتات</div>
      <label class="switch"><input type="checkbox" id="ticketsEnabled" ${c.ticketsEnabled?'checked':''}><span class="switch-slider"></span>تفعيل التكتات</label>
      <label>كاتيجوري التكتات</label>
      <select id="ticketCategory">${catOpts(c.ticketCategory)}</select>
      <label>قناة اللوقات للتكتات</label>
      <select id="ticketLogChannel">${chOpts(c.ticketLogChannel)}</select>
      <label>رول الدعم</label>
      <select id="ticketSupportRole">${roleOpts(c.ticketSupportRole)}</select>
      <label>رسالة التكت</label>
      <textarea id="ticketMessage">${c.ticketMessage||''}</textarea>
      <br><button onclick="save(['ticketsEnabled','ticketCategory','ticketLogChannel','ticketSupportRole','ticketMessage'])">💾 حفظ</button>
    </div>`;

  else if (name === 'giveaways') {
    html = `<div class="card"><div class="card-title">🎁 الجيفاواي</div><div id="giveawaysList"><div class="spinner"></div></div></div>`;
    setTimeout(loadGiveaways, 30);
  }

  else if (name === 'reactions') html = `
    <div class="card">
      <div class="card-title">🎭 Reaction Roles</div>
      <p style="color:var(--muted);font-size:13px;margin-bottom:14px">لما عضو يضغط إيموجي، ياخذ رول تلقائياً</p>
      <label>القناة</label>
      <select id="rrChannel">${chOpts()}</select>
      <label>ID الرسالة</label>
      <input id="rrMessage" placeholder="مثال: 1234567890123456789">
      <label>الإيموجي</label>
      <input id="rrEmoji" placeholder="مثال: ✅" maxlength="4">
      <label>الرول</label>
      <select id="rrRole">${roleOpts()}</select>
      <br><br><button onclick="createReactionRole()">➕ إنشاء</button>
    </div>`;

  else if (name === 'automod') html = `
    <div class="card">
      <div class="card-title">🚫 Auto Moderation</div>
      <label class="switch"><input type="checkbox" id="antiSpam" ${c.antiSpam?'checked':''}><span class="switch-slider"></span>منع السبام</label>
      <label class="switch"><input type="checkbox" id="antiLink" ${c.antiLink?'checked':''}><span class="switch-slider"></span>منع الروابط</label>
      <label class="switch"><input type="checkbox" id="antiCaps" ${c.antiCaps?'checked':''}><span class="switch-slider"></span>منع الأحرف الكبيرة</label>
      <label>كلمات ممنوعة (افصل بينها بفاصلة)</label>
      <textarea id="badWords">${(c.badWords||[]).join(', ')}</textarea>
      <br><button onclick="saveAutoMod()">💾 حفظ</button>
    </div>`;

  else if (name === 'bot') {
    const av = state.botInfo?.botAvatar || 'https://cdn.discordapp.com/embed/avatars/0.png';
    html = `
      <div class="card">
        <div class="card-title">🎛️ تحكم بالبوت</div>
        <p style="color:var(--muted);font-size:12px;margin-bottom:12px">ملاحظة: تغيير اسم وصورة البوت يطبّق على البوت عالمياً، مو على سيرفر واحد فقط</p>

        <label>صورة البوت</label>
        <div class="avatar-upload">
          <img id="botAvatarPreview" class="avatar-preview" src="${av}" alt="bot">
          <label class="upload-label" for="botAvatarInput">
            <input type="file" id="botAvatarInput" accept="image/*" onchange="onBotAvatarChange(event)">
            <svg style="width:32px;height:32px;fill:var(--primary);margin:0 auto" viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
            <div class="upload-label-text">اضغط لاختيار صورة من جهازك</div>
          </label>
          <button class="small" onclick="applyBotAvatar()" id="avatarBtn" style="display:none">💾 تطبيق الصورة</button>
        </div>

        <label>اسم البوت</label>
        <input id="botName" value="${(state.botInfo?.bot||'').split('#')[0]||''}" maxlength="32">

        <label>حالة البوت (النص)</label>
        <input id="botStatus" value="${c.botStatus||'the dashboard 👀'}">
        <label>نوع الحالة</label>
        <select id="botStatusType">
          <option value="Watching" ${c.botStatusType==='Watching'?'selected':''}>👀 Watching</option>
          <option value="Playing" ${c.botStatusType==='Playing'?'selected':''}>🎮 Playing</option>
          <option value="Listening" ${c.botStatusType==='Listening'?'selected':''}>🎧 Listening</option>
          <option value="Competing" ${c.botStatusType==='Competing'?'selected':''}>🏆 Competing</option>
        </select>
        <br><br>
        <button onclick="changeBotStatus()">🚀 تطبيق الحالة</button>
        <button class="pink" onclick="changeBotName()">✏️ تغيير الاسم</button>
      </div>`;
  }

  else if (name === 'announce') html = `
    <div class="card">
      <div class="card-title">📢 إرسال إعلان</div>
      <label>القناة</label>
      <select id="annCh">${chOpts()}</select>
      <label>العنوان</label>
      <input id="annTitle" placeholder="عنوان الإعلان">
      <label>المحتوى</label>
      <textarea id="annDesc" placeholder="نص الإعلان..."></textarea>
      <label>اللون</label>
      <input id="annColor" type="color" value="#5865F2">
      <br><br><button onclick="sendAnnounce()">📢 إرسال</button>
    </div>`;

  else if (name === 'warnings') {
    html = `<div class="card"><div class="card-title">⚠️ سجل التحذيرات</div><div id="warnsBox"><div class="spinner"></div></div></div>`;
    setTimeout(loadWarnings, 30);
  }

  else if (name === 'commands') {
    const all = ['ping','help','serverinfo','userinfo','avatar','kick','ban','unban','timeout','warn','warnings','clear','lock','unlock','slowmode','role','8ball','dice','coinflip','trivia','rps','poll','say','qrcode','balance','daily','work','pay','leaderboard','rank','ticket','giveaway'];
    html = `
      <div class="card">
        <div class="card-title">⚙️ تفعيل/تعطيل الأوامر</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px">
          ${all.map(cmd => `
            <label class="switch">
              <input type="checkbox" data-cmd="${cmd}" ${!c.disabledCommands?.includes(cmd)?'checked':''}>
              <span class="switch-slider"></span> /${cmd}
            </label>`).join('')}
        </div>
        <br><button onclick="saveCommands()">💾 حفظ</button>
      </div>`;
  }

  else if (name === 'leaderboard') {
    html = `<div class="card"><div class="card-title">🏆 المتصدرين</div><div id="lbBox"><div class="spinner"></div></div></div>`;
    setTimeout(loadLeaderboard, 30);
  }

  document.getElementById('tab-content').innerHTML = html;
}

// ===== SAVE =====
async function save(fields) {
  const updates = {};
  for (const id of fields) {
    const el = document.getElementById(id);
    if (!el) continue;
    updates[id] = el.type === 'checkbox' ? el.checked : (el.value || null);
  }
  try {
    state.config = await api('/api/guild/' + state.currentGuild.id, { method: 'PATCH', body: JSON.stringify(updates) });
    toast('✅ تم الحفظ');
  } catch (e) { toast(e.message, 'err'); }
}

// ===== REPLIES =====
function renderReplies() {
  const list = document.getElementById('repliesList');
  const arr = state.config.autoReplies || [];
  if (!arr.length) return list.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px">ما في ردود بعد</p>';
  list.innerHTML = arr.map((r, i) => `
    <div class="reply-item">
      <input value="${r.trigger||''}" placeholder="الكلمة" data-i="${i}" data-f="trigger">
      <input value="${r.response||''}" placeholder="الرد" data-i="${i}" data-f="response">
      <label class="switch" style="margin:0">
        <input type="checkbox" ${r.exact?'checked':''} data-i="${i}" data-f="exact">
        <span class="switch-slider"></span>
      </label>
      <button class="danger small" onclick="removeReply(${i})">🗑</button>
    </div>`).join('');
}

function addReply() {
  if (!state.config.autoReplies) state.config.autoReplies = [];
  state.config.autoReplies.push({ trigger: '', response: '', exact: false });
  renderReplies();
}

function removeReply(i) {
  state.config.autoReplies.splice(i, 1);
  renderReplies();
}

async function saveReplies() {
  const items = document.querySelectorAll('#repliesList .reply-item');
  const arr = [];
  items.forEach(el => {
    const o = {};
    el.querySelectorAll('[data-f]').forEach(inp => {
      o[inp.dataset.f] = inp.dataset.f === 'exact' ? inp.checked : inp.value;
    });
    if (o.trigger && o.response) arr.push(o);
  });
  try {
    state.config = await api('/api/guild/' + state.currentGuild.id, { method: 'PATCH', body: JSON.stringify({ autoReplies: arr }) });
    toast('✅ تم حفظ ' + arr.length + ' رد');
  } catch (e) { toast(e.message, 'err'); }
}

// ===== COMMANDS =====
async function saveCommands() {
  const disabled = [];
  document.querySelectorAll('#tab-content input[data-cmd]').forEach(inp => {
    if (!inp.checked) disabled.push(inp.dataset.cmd);
  });
  try {
    state.config = await api('/api/guild/' + state.currentGuild.id, { method: 'PATCH', body: JSON.stringify({ disabledCommands: disabled }) });
    toast('✅ تم الحفظ');
  } catch (e) { toast(e.message, 'err'); }
}

// ===== AUTOMOD =====
async function saveAutoMod() {
  const bw = document.getElementById('badWords').value.split(',').map(s => s.trim()).filter(Boolean);
  try {
    state.config = await api('/api/guild/' + state.currentGuild.id, { method: 'PATCH', body: JSON.stringify({
      antiSpam: document.getElementById('antiSpam').checked,
      antiLink: document.getElementById('antiLink').checked,
      antiCaps: document.getElementById('antiCaps').checked,
      badWords: bw,
    }) });
    toast('✅ تم الحفظ');
  } catch (e) { toast(e.message, 'err'); }
}

// ===== BOT STATUS =====
async function changeBotStatus() {
  try {
    await api('/api/guild/' + state.currentGuild.id + '/status', { method: 'POST', body: JSON.stringify({
      text: document.getElementById('botStatus').value,
      type: document.getElementById('botStatusType').value,
    }) });
    toast('✅ تم تغيير الحالة');
  } catch (e) { toast(e.message, 'err'); }
}

function onBotAvatarChange(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) return toast('حجم الصورة كبير (الحد 8MB)', 'err');
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('botAvatarPreview').src = ev.target.result;
    state.botAvatarData = ev.target.result;
    state.botAvatarFile = file;
    document.getElementById('avatarBtn').style.display = 'inline-flex';
  };
  reader.readAsDataURL(file);
}

async function applyBotAvatar() {
  if (!state.botAvatarData) return toast('اختر صورة أول', 'err');
  toast('جاري الرفع... هذا الخيار يحتاج تحديث في البوت', 'info');
}

async function changeBotName() {
  const name = document.getElementById('botName').value.trim();
  if (!name) return toast('اكتب اسم', 'err');
  try {
    await api('/api/bot/name', { method: 'POST', body: JSON.stringify({ name }) });
    toast('✅ تم تغيير الاسم');
    state.botInfo.bot = name;
  } catch (e) { toast('هذا الخيار يحتاج تحديث في البوت', 'err'); }
}

// ===== ANNOUNCE =====
async function sendAnnounce() {
  const body = {
    channelId: document.getElementById('annCh').value,
    title: document.getElementById('annTitle').value,
    description: document.getElementById('annDesc').value,
    color: parseInt(document.getElementById('annColor').value.replace('#',''), 16),
  };
  try {
    await api('/api/guild/' + state.currentGuild.id + '/announce', { method: 'POST', body: JSON.stringify(body) });
    toast('✅ تم الإرسال');
  } catch (e) { toast(e.message, 'err'); }
}

// ===== WARNINGS =====
async function loadWarnings() {
  try {
    const warns = await api('/api/guild/' + state.currentGuild.id + '/warnings');
    const box = document.getElementById('warnsBox');
    if (!warns.length) return box.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px">ما في تحذيرات</p>';
    box.innerHTML = warns.map(w => `
      <div style="background:var(--card2);padding:12px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <div style="min-width:0;flex:1">
          <div style="font-weight:700;font-size:13px"><span class="badge yellow">⚠</span>@${w.userId}</div>
          <div style="color:var(--muted);font-size:12px;margin-top:4px;word-break:break-word">${w.reason}</div>
          <div style="color:var(--muted);font-size:11px;margin-top:2px">بواسطة @${w.moderatorId}</div>
        </div>
        <button class="danger small" onclick="delWarn('${w._id}')">🗑</button>
      </div>`).join('');
  } catch (e) { toast(e.message, 'err'); }
}

async function delWarn(id) {
  try {
    await api('/api/guild/' + state.currentGuild.id + '/warnings/' + id, { method: 'DELETE' });
    toast('✅ تم الحذف');
    loadWarnings();
  } catch (e) { toast(e.message, 'err'); }
}

// ===== LEADERBOARD =====
async function loadLeaderboard() {
  try {
    const lb = await api('/api/guild/' + state.currentGuild.id + '/leaderboard');
    const box = document.getElementById('lbBox');
    if (!lb.length) return box.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px">ما في بيانات</p>';
    box.innerHTML = lb.map((u, i) => {
      const medal = ['🥇','🥈','🥉'][i] || `#${i+1}`;
      return `
        <div style="background:var(--card2);padding:11px;border-radius:10px;margin:6px 0;display:flex;align-items:center;gap:10px">
          <div style="font-size:20px;width:36px;text-align:center;flex-shrink:0">${medal}</div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${u.username}</div>
            <div style="color:var(--muted);font-size:11px">مستوى: ${u.level} • رسائل: ${u.messages}</div>
          </div>
          <div style="font-weight:900;color:var(--yellow);font-size:13px">${u.coins}</div>
        </div>`;
    }).join('');
  } catch (e) { toast(e.message, 'err'); }
}

// ===== GIVEAWAYS =====
async function loadGiveaways() {
  try {
    const gs = await api('/api/guild/' + state.currentGuild.id + '/giveaways');
    const box = document.getElementById('giveawaysList');
    if (!gs.length) return box.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px">ما في جيفاويات</p>';
    box.innerHTML = gs.map(g => `
      <div style="background:var(--card2);padding:12px;border-radius:10px;margin:6px 0">
        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px">
          <div style="font-weight:700;font-size:14px">🎁 ${g.prize}</div>
          <span class="badge ${g.ended ? 'red' : 'green'}">${g.ended ? 'انتهى' : 'نشط'}</span>
        </div>
        <div style="color:var(--muted);font-size:11px;margin-top:6px">فائزون: ${g.winners} • مشاركون: ${g.participants?.length || 0}</div>
      </div>`).join('');
  } catch (e) { toast(e.message, 'err'); }
}

// ===== REACTION ROLE =====
async function createReactionRole() {
  const body = {
    channelId: document.getElementById('rrChannel').value,
    messageId: document.getElementById('rrMessage').value.trim(),
    emoji: document.getElementById('rrEmoji').value.trim(),
    roleId: document.getElementById('rrRole').value,
  };
  if (!body.channelId || !body.messageId || !body.emoji || !body.roleId) return toast('املأ كل الحقول', 'err');
  try {
    await api('/api/guild/' + state.currentGuild.id + '/reactionrole', { method: 'POST', body: JSON.stringify(body) });
    toast('✅ تم الإنشاء');
  } catch (e) { toast(e.message, 'err'); }
}

init();
</script>
</body>
</html>
