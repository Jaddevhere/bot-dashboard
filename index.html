<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dis-Bot | لوحة التحكم</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07080d;--card:#12141d;--card2:#1a1d29;--border:#22263a;
  --text:#fff;--muted:#8a90a8;--primary:#5865F2;--primary2:#4752C4;
  --green:#57F287;--red:#ED4245;--yellow:#FEE75C;--pink:#EB459E;
}
html,body{overflow-x:hidden}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  background-image:
    radial-gradient(circle at 15% 20%,rgba(88,101,242,.15) 0%,transparent 45%),
    radial-gradient(circle at 85% 80%,rgba(235,69,158,.1) 0%,transparent 45%),
    radial-gradient(circle at 50% 50%,rgba(87,242,135,.05) 0%,transparent 60%);
}
/* ============ 3D LOADER ============ */
#loader{
  position:fixed;inset:0;background:#07080d;z-index:9999;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  perspective:1000px;transition:opacity .8s ease,visibility .8s;
}
#loader.hide{opacity:0;visibility:hidden}
.loader-scene{
  width:200px;height:200px;position:relative;transform-style:preserve-3d;
  animation:spin 4s infinite linear;
}
@keyframes spin{
  0%{transform:rotateX(15deg) rotateY(0)}
  100%{transform:rotateX(15deg) rotateY(360deg)}
}
.cube{
  position:absolute;width:120px;height:120px;
  top:40px;left:40px;transform-style:preserve-3d;
}
.cube-face{
  position:absolute;width:120px;height:120px;
  background:linear-gradient(135deg,rgba(88,101,242,.85),rgba(235,69,158,.85));
  border:2px solid rgba(255,255,255,.3);
  border-radius:12px;
  box-shadow:0 0 30px rgba(88,101,242,.7),inset 0 0 20px rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;
  font-size:48px;
}
.cube-face:nth-child(1){transform:translateZ(60px)}
.cube-face:nth-child(2){transform:rotateY(180deg) translateZ(60px)}
.cube-face:nth-child(3){transform:rotateY(90deg) translateZ(60px)}
.cube-face:nth-child(4){transform:rotateY(-90deg) translateZ(60px)}
.cube-face:nth-child(5){transform:rotateX(90deg) translateZ(60px)}
.cube-face:nth-child(6){transform:rotateX(-90deg) translateZ(60px)}
.loader-title{
  margin-top:60px;font-size:32px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(135deg,#5865F2,#EB459E,#57F287);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;background-size:200% 200%;
  animation:gradient 2s infinite;
}
@keyframes gradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.loader-sub{color:var(--muted);margin-top:10px;font-size:14px;letter-spacing:1px}
.loader-bar{
  width:260px;height:4px;background:#1a1d29;border-radius:4px;margin-top:30px;overflow:hidden;
}
.loader-bar::after{
  content:'';display:block;height:100%;width:0;
  background:linear-gradient(90deg,#5865F2,#EB459E);
  border-radius:4px;animation:load 5s forwards cubic-bezier(.4,0,.2,1);
}
@keyframes load{to{width:100%}}
.particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.particle{
  position:absolute;width:3px;height:3px;background:#5865F2;border-radius:50%;
  animation:float 8s infinite;opacity:.6;
}
@keyframes float{
  0%{transform:translateY(100vh) scale(0);opacity:0}
  10%{opacity:.8}
  90%{opacity:.8}
  100%{transform:translateY(-10vh) scale(1.5);opacity:0}
}
/* ============ TRANSITIONS ============ */
.page{display:none;animation:fadeIn .5s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.slide-up{animation:slideUp .6s cubic-bezier(.4,0,.2,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
/* ============ LAYOUT ============ */
.container{max-width:1150px;margin:0 auto;padding:20px}
.topbar{
  position:sticky;top:0;z-index:100;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  background:rgba(7,8,13,.75);border-bottom:1px solid var(--border);
  padding:14px 24px;display:flex;justify-content:space-between;align-items:center;
}
.topbar-logo{font-weight:900;font-size:20px;
  background:linear-gradient(135deg,#5865F2,#EB459E);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  display:flex;align-items:center;gap:10px;
}
.topbar-user{display:flex;align-items:center;gap:12px;font-size:14px}
.topbar-user img{width:36px;height:36px;border-radius:50%;border:2px solid var(--primary)}
/* ============ CARD ============ */
.card{
  background:linear-gradient(135deg,rgba(18,20,29,.9),rgba(26,29,41,.9));
  border:1px solid var(--border);border-radius:16px;padding:22px;margin:15px 0;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:all .3s cubic-bezier(.4,0,.2,1);
}
.card:hover{border-color:rgba(88,101,242,.5);transform:translateY(-2px);
  box-shadow:0 10px 40px rgba(88,101,242,.15)}
.card-title{font-size:18px;font-weight:800;margin-bottom:15px;display:flex;align-items:center;gap:10px}
/* ============ BUTTONS ============ */
button{
  background:linear-gradient(135deg,#5865F2,#4752C4);color:#fff;border:none;
  padding:12px 24px;border-radius:10px;cursor:pointer;font-size:15px;font-weight:700;
  transition:all .25s cubic-bezier(.4,0,.2,1);font-family:inherit;
  box-shadow:0 4px 15px rgba(88,101,242,.3);
}
button:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(88,101,242,.5)}
button:active{transform:translateY(0)}
button.sec{background:var(--card2);color:#fff;box-shadow:none;border:1px solid var(--border)}
button.sec:hover{background:#252938;box-shadow:0 4px 15px rgba(0,0,0,.3)}
button.danger{background:linear-gradient(135deg,#ED4245,#c73a3d);box-shadow:0 4px 15px rgba(237,66,69,.3)}
button.success{background:linear-gradient(135deg,#57F287,#3ba55d);color:#000;box-shadow:0 4px 15px rgba(87,242,135,.3)}
button.pink{background:linear-gradient(135deg,#EB459E,#c93680);box-shadow:0 4px 15px rgba(235,69,158,.3)}
button.small{padding:6px 12px;font-size:13px}
/* ============ INPUTS ============ */
input,select,textarea{
  background:var(--card2);color:#fff;border:1px solid var(--border);
  padding:12px 14px;border-radius:10px;width:100%;font-size:14px;font-family:inherit;
  transition:all .2s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(88,101,242,.15)}
textarea{min-height:90px;resize:vertical}
label{display:block;margin:14px 0 6px;font-size:14px;color:var(--muted);font-weight:600}
/* ============ SWITCH ============ */
.switch{display:inline-flex;align-items:center;gap:12px;cursor:pointer;padding:8px 0;user-select:none}
.switch input{display:none}
.switch-slider{
  width:48px;height:26px;background:var(--border);border-radius:20px;position:relative;
  transition:.3s;flex-shrink:0;
}
.switch-slider::before{
  content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;
  top:3px;right:3px;transition:.3s;
}
.switch input:checked + .switch-slider{background:linear-gradient(135deg,#5865F2,#4752C4)}
.switch input:checked + .switch-slider::before{transform:translateX(-22px)}
/* ============ LANDING ============ */
.hero{
  text-align:center;padding:60px 20px;
  background:linear-gradient(135deg,rgba(88,101,242,.1),rgba(235,69,158,.05));
  border-radius:24px;margin:20px 0;border:1px solid var(--border);
  position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle,rgba(88,101,242,.15),transparent 40%);
  animation:rotate 20s infinite linear;pointer-events:none;
}
@keyframes rotate{to{transform:rotate(360deg)}}
.hero h1{font-size:clamp(28px,5vw,48px);font-weight:900;margin-bottom:15px;
  background:linear-gradient(135deg,#5865F2,#EB459E,#57F287);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  background-size:200% 200%;animation:gradient 3s infinite;position:relative;
}
.hero p{color:var(--muted);font-size:16px;max-width:600px;margin:0 auto 30px;position:relative;line-height:1.7}
.hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;position:relative}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin:20px 0}
.stat-card{
  background:linear-gradient(135deg,rgba(88,101,242,.1),rgba(235,69,158,.05));
  border:1px solid var(--border);border-radius:14px;padding:20px;text-align:center;
  transition:all .3s;
}
.stat-card:hover{transform:translateY(-5px);border-color:var(--primary)}
.stat-num{font-size:32px;font-weight:900;
  background:linear-gradient(135deg,#5865F2,#EB459E);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.stat-label{font-size:13px;color:var(--muted);margin-top:6px}
.feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}
.feature{
  background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;
  transition:all .3s;position:relative;overflow:hidden;
}
.feature:hover{transform:translateY(-5px);border-color:var(--primary);
  box-shadow:0 15px 40px rgba(88,101,242,.2)}
.feature::before{
  content:'';position:absolute;top:0;right:0;width:100%;height:3px;
  background:linear-gradient(90deg,#5865F2,#EB459E,#57F287);
  transform:translateX(-100%);transition:.5s;
}
.feature:hover::before{transform:translateX(0)}
.feature-icon{font-size:32px;margin-bottom:10px}
.feature-title{font-weight:800;margin-bottom:8px;font-size:15px}
.feature-desc{color:var(--muted);font-size:13px;line-height:1.6}
.update-item{
  display:flex;gap:12px;padding:14px;border-radius:10px;background:var(--card2);
  margin:8px 0;border-right:3px solid var(--primary);transition:.2s;
}
.update-item:hover{transform:translateX(-5px);background:#1f2330}
.update-badge{
  background:linear-gradient(135deg,#5865F2,#4752C4);color:#fff;
  padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;
  height:fit-content;white-space:nowrap;
}
.update-text{flex:1;font-size:14px}
.update-time{font-size:12px;color:var(--muted);margin-top:4px}
/* ============ GUILD CARDS ============ */
.guild-card{
  display:flex;align-items:center;gap:16px;padding:16px;
  background:var(--card2);border-radius:14px;cursor:pointer;margin:10px 0;
  transition:all .3s;border:1px solid transparent;
}
.guild-card:hover{background:#252938;border-color:var(--primary);transform:translateX(-5px)}
.guild-icon{width:56px;height:56px;border-radius:50%;border:2px solid var(--border);flex-shrink:0}
.guild-info{flex:1;min-width:0}
.guild-name{font-weight:800;font-size:16px;margin-bottom:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.guild-members{color:var(--muted);font-size:13px}
.guild-badge{background:var(--primary);color:#fff;padding:3px 10px;border-radius:20px;
  font-size:11px;font-weight:700}
/* ============ TABS ============ */
.tabs{display:flex;gap:8px;margin:20px 0;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.tabs::-webkit-scrollbar{height:6px}
.tabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.tab{
  padding:11px 18px;background:var(--card2);border-radius:10px;cursor:pointer;
  border:1px solid var(--border);color:var(--muted);white-space:nowrap;
  font-size:14px;font-weight:700;transition:.25s;
}
.tab:hover{color:#fff;border-color:var(--primary)}
.tab.active{background:linear-gradient(135deg,#5865F2,#4752C4);color:#fff;
  border-color:transparent;box-shadow:0 4px 15px rgba(88,101,242,.4)}
/* ============ AUTO-REPLIES ============ */
.reply-item{
  display:grid;grid-template-columns:1fr 1fr auto auto;gap:10px;align-items:center;
  background:var(--card2);padding:10px;border-radius:10px;margin:8px 0;
}
.reply-item input{padding:8px 12px;font-size:13px}
@media(max-width:700px){.reply-item{grid-template-columns:1fr 1fr}}
/* ============ TOAST ============ */
.toast{
  position:fixed;bottom:24px;left:24px;background:var(--green);color:#000;
  padding:14px 22px;border-radius:12px;font-weight:700;display:none;z-index:1000;
  box-shadow:0 10px 30px rgba(87,242,135,.4);animation:slideIn .3s ease;
}
.toast.err{background:var(--red);color:#fff;box-shadow:0 10px 30px rgba(237,66,69,.4)}
.toast.info{background:var(--primary);color:#fff;box-shadow:0 10px 30px rgba(88,101,242,.4)}
@keyframes slideIn{from{transform:translateX(-100%);opacity:0}to{transform:translateX(0);opacity:1}}
/* ============ MISC ============ */
.loading{text-align:center;padding:40px;color:var(--muted)}
.spinner{
  width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--primary);
  border-radius:50%;animation:spin2 1s linear infinite;margin:0 auto 15px;
}
@keyframes spin2{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-state-icon{font-size:60px;margin-bottom:15px;opacity:.5}
.gradient-text{background:linear-gradient(135deg,#5865F2,#EB459E);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;
  font-weight:700;margin-right:6px}
.badge.green{background:rgba(87,242,135,.15);color:var(--green)}
.badge.red{background:rgba(237,66,69,.15);color:var(--red)}
.badge.yellow{background:rgba(254,231,92,.15);color:var(--yellow)}
.divider{height:1px;background:var(--border);margin:20px 0}
@media(max-width:600px){
  .container{padding:12px}
  .topbar{padding:12px 16px}
  .card{padding:16px;border-radius:12px}
  .tabs{gap:6px}
  .tab{padding:9px 14px;font-size:13px}
  button{padding:10px 18px;font-size:14px}
  .hero{padding:40px 15px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<!-- ========== 3D LOADER ========== -->
<div id="loader">
  <div class="particles" id="particles"></div>
  <div class="loader-scene">
    <div class="cube">
      <div class="cube-face">🤖</div>
      <div class="cube-face">⚡</div>
      <div class="cube-face">🎮</div>
      <div class="cube-face">💎</div>
      <div class="cube-face">🚀</div>
      <div class="cube-face">⭐</div>
    </div>
  </div>
  <div class="loader-title">DIS-BOT</div>
  <div class="loader-sub">جاري التحميل...</div>
  <div class="loader-bar"></div>
</div>

<!-- ========== TOPBAR ========== -->
<div class="topbar" id="topbar" style="display:none">
  <div class="topbar-logo">🤖 DIS-BOT</div>
  <div id="topbar-right"></div>
</div>

<div class="container" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const API = 'https://dis-bot-qf91.onrender.com';

// ============ PARTICLES ============
(function(){
  const p = document.getElementById('particles');
  for (let i = 0; i < 25; i++) {
    const el = document.createElement('div');
    el.className = 'particle';
    el.style.left = Math.random()*100 + '%';
    el.style.animationDelay = Math.random()*8 + 's';
    el.style.animationDuration = (6 + Math.random()*6) + 's';
    el.style.background = ['#5865F2','#EB459E','#57F287','#FEE75C'][Math.floor(Math.random()*4)];
    p.appendChild(el);
  }
})();

// ============ LOADER ============
setTimeout(() => {
  document.getElementById('loader').classList.add('hide');
  document.getElementById('topbar').style.display = 'flex';
  init();
}, 5000);

// ============ STATE ============
const state = {
  token: null, user: null, guilds: [], currentGuild: null,
  config: null, channels: [], categories: [], roles: [], botInfo: null, view: 'landing',
};

const urlParams = new URLSearchParams(location.search);
if (urlParams.get('token')) {
  localStorage.setItem('token', urlParams.get('token'));
  history.replaceState({}, '', location.pathname);
}
state.token = localStorage.getItem('token');

// ============ API HELPER ============
async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(state.token ? { Authorization: 'Bearer ' + state.token } : {}),
      ...(opts.headers || {}),
    },
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'خطأ');
  return res.json();
}

// ============ TOAST ============
function toast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (type === 'err' ? ' err' : type === 'info' ? ' info' : '');
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.display = 'none', 3000);
}

// ============ INIT ============
async function init() {
  try { state.botInfo = await api('/'); } catch {}
  renderTopbar();
  if (!state.token) return renderLanding();
  try {
    state.user = await api('/api/me');
    state.guilds = await api('/api/guilds');
    renderTopbar();
    renderLanding();
  } catch {
    localStorage.removeItem('token');
    state.token = null;
    renderLanding();
  }
}

// ============ TOPBAR ============
function renderTopbar() {
  const el = document.getElementById('topbar-right');
  if (state.user) {
    el.innerHTML = `
      <div class="topbar-user">
        <span style="color:var(--muted)">${state.user.username}</span>
        <img src="${state.user.avatar ? `https://cdn.discordapp.com/avatars/${state.user.id}/${state.user.avatar}.png` : 'https://cdn.discordapp.com/embed/avatars/0.png'}">
        <button class="sec small" onclick="logout()">خروج</button>
      </div>`;
  } else {
    el.innerHTML = `<button onclick="login()">🎮 تسجيل الدخول</button>`;
  }
}

function login() { location.href = API + '/auth/login'; }
function logout() { localStorage.removeItem('token'); state.token = null; state.user = null; location.reload(); }

// ============ ROUTER ============
function show(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) { el.classList.add('active'); el.classList.add('slide-up'); }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============ LANDING ============
function renderLanding() {
  state.view = 'landing';
  const bot = state.botInfo || {};
  const uptimeH = Math.floor((bot.uptime || 0) / 3600);
  const uptimeM = Math.floor(((bot.uptime || 0) % 3600) / 60);

  document.getElementById('app').innerHTML = `
    <div class="page active" id="page-landing">
      <div class="hero">
        <h1>🤖 DIS-BOT</h1>
        <p>بوت ديسكورد متكامل مع لوحة تحكم احترافية — إدارة، ترفيه، مستويات، اقتصاد، تكتات، وجيفاواي في مكان واحد.</p>
        <div class="hero-btns">
          ${state.user
            ? `<button onclick="goServers()">🖥️ سيرفراتي (${state.guilds.length})</button>`
            : `<button onclick="login()">🎮 تسجيل الدخول</button>`}
          <button class="sec" onclick="window.open('${API}/api/bot-invite','_blank')">➕ أضف البوت</button>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-num">${bot.status === 'online' ? '🟢' : '🔴'}</div>
          <div class="stat-label">حالة البوت</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">${uptimeH}h ${uptimeM}m</div>
          <div class="stat-label">مدة التشغيل</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">${bot.bot || 'Loading'}</div>
          <div class="stat-label">اسم البوت</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">16+</div>
          <div class="stat-label">أمر Slash</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">✨ المميزات</div>
        <div class="feature-grid">
          ${[
            ['🛡️','إدارة كاملة','أوامر kick, ban, warn, mute مع سجل تحذيرات'],
            ['⭐','نظام المستويات','XP لكل رسالة ورولات مكافأة'],
            ['💰','اقتصاد متكامل','عملة، رصيد يومي، عمل، تحويلات'],
            ['🎫','نظام التكتات','تذاكر دعم بأزرار إغلاق تلقائية'],
            ['🎁','الجيفاواي','سحب تلقائي للفائزين'],
            ['💬','ردود تلقائية','رد على كلمات محددة تلقائياً'],
            ['🎭','Reaction Roles','رولات بإيموجي'],
            ['🚫','Auto Moderation','منع سبام، روابط، كلمات ممنوعة'],
            ['🎨','Embed Builder','إعلانات احترافية بألوان'],
            ['👋','ترحيب تلقائي','رسائل ترحيب ووداع ورول تلقائي'],

  try {
    const data = await api('/api/guild/' + id);
    state.currentGuild = state.guilds.find(g => g.id === id);
    state.config = data.config;
    state.channels = data.channels;
    state.categories = data.categories || [];
    state.roles = data.roles;

}

// ============ SAVE ============
async function save(fields) {
  const updates = {};
  for (const id of fields) {
    const el = document.getElementById(id);
    if (!el) continue;
    updates[id] = el.type === 'checkbox' ? el.checked : (el.value || null);
  }
  try {
    state.config = await api('/api/guild/' + state.currentGuild.id, { method: 'PATCH', body: JSON.stringify(updates) });
    toast('✅ تم الحفظ');
  } catch (e) { toast(e.message, 'err'); }
}

// ============ AUTO-REPLIES ============
function renderReplies() {
  const list = document.getElementById('repliesList');
  const arr = state.config.autoReplies || [];
  if (!arr.length) return list.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px">ما في ردود بعد</p>';
  list.innerHTML = arr.map((r, i) => `
    <div class="reply-item">
      <input value="${r.trigger||''}" placeholder="الكلمة" data-i="${i}" data-f="trigger">
      <input value="${r.response||''}" placeholder="الرد" data-i="${i}" data-f="response">
      <label class="switch" style="margin:0">
        <input type="checkbox" ${r.exact?'checked':''} data-i="${i}" data-f="exact">
        <span class="switch-slider"></span>
      </label>
      <button class="danger small" onclick="removeReply(${i})">🗑️</button>
    </div>`).join('');
}

function addReply() {
  if (!state.config.autoReplies) state.config.autoReplies = [];
  state.config.autoReplies.push({ trigger: '', response: '', exact: false });
  renderReplies();
}

function removeReply(i) {
  state.config.autoReplies.splice(i, 1);
  renderReplies();
}

async function saveReplies() {
  const items = document.querySelectorAll('#repliesList .reply-item');
  const arr = [];
  items.forEach(el => {
    const inputs = el.querySelectorAll('[data-f]');
    const o = {};
    inputs.forEach(inp => {
      const f = inp.dataset.f;
      o[f] = f === 'exact' ? inp.checked : inp.value;
    });
    if (o.trigger && o.response) arr.push(o);
  });
  try {
    state.config = await api('/api/guild/' + state.currentGuild.id, { method: 'PATCH', body: JSON.stringify({ autoReplies: arr }) });
    toast('✅ تم حفظ ' + arr.length + ' رد');
  } catch (e) { toast(e.message, 'err'); }
}

// ============ COMMANDS ============
async function saveCommands() {
  const disabled = [];
  document.querySelectorAll('#tab-content input[data-cmd]').forEach(inp => {
    if (!inp.checked) disabled.push(inp.dataset.cmd);
  });
  try {
    state.config = await api('/api/guild/' + state.currentGuild.id, { method: 'PATCH', body: JSON.stringify({ disabledCommands: disabled }) });
    toast('✅ تم الحفظ');
  } catch (e) { toast(e.message, 'err'); }
}

// ============ AUTOMOD ============
async function saveAutoMod() {
  const bw = document.getElementById('badWords').value
    .split(',').map(s => s.trim()).filter(Boolean);
  try {
    state.config = await api('/api/guild/' + state.currentGuild.id, { method: 'PATCH', body: JSON.stringify({
      antiSpam: document.getElementById('antiSpam').checked,
      antiLink: document.getElementById('antiLink').checked,
      antiCaps: document.getElementById('antiCaps').checked,
      badWords: bw,
    }) });
    toast('✅ تم الحفظ');
  } catch (e) { toast(e.message, 'err'); }
}

    await api('/api/guild/' + state.currentGuild.id + '/announce', { method: 'POST', body: JSON.stringify(body) });

// ============ WARNINGS ============
async function loadWarnings() {
  try {
    const warns = await api('/api/guild/' + state.currentGuild.id + '/warnings');
    const box = document.getElementById('warnsBox');
    if (!warns.length) return box.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px">ما في تحذيرات</p>';
    box.innerHTML = warns.map(w => `
      <div style="background:var(--card2);padding:12px;border-radius:10px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <div>
          <div style="font-weight:700"><span class="badge yellow">⚠️</span>@${w.userId}</div>
          <div style="color:var(--muted);font-size:13px;margin-top:4px">${w.reason}</div>
          <div style="color:var(--muted);font-size:12px;margin-top:2px">بواسطة @${w.moderatorId} — ${new Date(w.createdAt).toLocaleString('ar')}</div>
        </div>
        <button class="danger small" onclick="delWarn('${w._id}')">🗑️</button>
      </div>`).join('');
  } catch (e) { toast(e.message, 'err'); }
}

async function delWarn(id) {
  try {
    await api('/api/guild/' + state.currentGuild.id + '/warnings/' + id, { method: 'DELETE' });
    toast('✅ تم الحذف');
    loadWarnings();
  } catch (e) { toast(e.message, 'err'); }
}

// ============ LEADERBOARD ============
async function loadLeaderboard() {
  try {
    const lb = await api('/api/guild/' + state.currentGuild.id + '/leaderboard');
    const box = document.getElementById('lbBox');
    if (!lb.length) return box.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px">ما في بيانات</p>';
    box.innerHTML = lb.map((u, i) => {
      const medal = ['🥇','🥈','🥉'][i] || `#${i+1}`;
      return `
        <div style="background:var(--card2);padding:12px;border-radius:10px;margin:8px 0;display:flex;align-items:center;gap:12px">
          <div style="font-size:22px;width:40px;text-align:center">${medal}</div>
          <div style="flex:1">
            <div style="font-weight:700">${u.username}</div>
            <div style="color:var(--muted);font-size:12px">المستوى: ${u.level} • الرسائل: ${u.messages}</div>
          </div>
          <div style="font-weight:900;color:var(--yellow)">${u.coins} 🪙</div>
        </div>`;
    }).join('');
  } catch (e) { toast(e.message, 'err'); }
}

// ============ GIVEAWAYS ============
async function loadGiveaways() {
  try {
    const gs = await api('/api/guild/' + state.currentGuild.id + '/giveaways');
    const box = document.getElementById('giveawaysList');
    if (!gs.length) return box.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px">ما في جيفاويات</p>';
    box.innerHTML = gs.map(g => `
      <div style="background:var(--card2);padding:12px;border-radius:10px;margin:8px 0">
        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px">
          <div style="font-weight:700">🎁 ${g.prize}</div>
          <span class="badge ${g.ended ? 'red' : 'green'}">${g.ended ? 'انتهى' : 'نشط'}</span>
        </div>
        <div style="color:var(--muted);font-size:12px;margin-top:6px">
          فائزون: ${g.winners} • مشاركون: ${g.participants?.length || 0}
        </div>
      </div>`).join('');
  } catch (e) { toast(e.message, 'err'); }
}

// ============ REACTION ROLE ============
async function createReactionRole() {
  const body = {
    channelId: document.getElementById('rrChannel').value,
    messageId: document.getElementById('rrMessage').value.trim(),
    emoji: document.getElementById('rrEmoji').value.trim(),
    roleId: document.getElementById('rrRole').value,
  };
  if (!body.channelId || !body.messageId || !body.emoji || !body.roleId) return toast('املأ كل الحقول', 'err');
  try {
    await api('/api/guild/' + state.currentGuild.id + '/reactionrole', { method: 'POST', body: JSON.stringify(body) });
    toast('✅ تم الإنشاء');
  } catch (e) { toast(e.message, 'err'); }
}

// ============ INIT ============
init();
</script>
</body>
</html>
