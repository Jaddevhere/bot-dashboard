<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم البوت</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: linear-gradient(135deg, #0f1117, #1a1d29); color: #fff; margin: 0; min-height: 100vh; padding: 20px; }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 { text-align: center; margin: 20px 0 30px; }
  .card { background: #1a1d29; padding: 20px; border-radius: 12px; margin: 15px 0; border: 1px solid #2a2e3d; }
  button { background: #5865F2; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; transition: 0.2s; }
  button:hover { background: #4752C4; }
  button.sec { background: #2a2e3d; }
  button.sec:hover { background: #353a4a; }
  button.danger { background: #ED4245; }
  button.danger:hover { background: #c73a3d; }
  input, select, textarea { background: #252938; color: #fff; border: 1px solid #353a4a; padding: 10px; border-radius: 8px; width: 100%; font-size: 14px; font-family: inherit; }
  textarea { min-height: 80px; resize: vertical; }
  label { display: block; margin: 12px 0 6px; font-size: 14px; color: #9aa0b0; }
  .center { text-align: center; padding: 60px 20px; }
  .guild-card { display: flex; align-items: center; gap: 15px; padding: 15px; background: #252938; border-radius: 10px; cursor: pointer; margin: 10px 0; transition: 0.2s; }
  .guild-card:hover { background: #303550; }
  .guild-icon { width: 50px; height: 50px; border-radius: 50%; }
  .tabs { display: flex; gap: 8px; margin: 20px 0; flex-wrap: wrap; }
  .tab { padding: 10px 18px; background: #252938; border-radius: 8px; cursor: pointer; border: none; color: #fff; }
  .tab.active { background: #5865F2; }
  .switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; padding: 8px 0; }
  .switch input { width: auto; }
  .toast { position: fixed; bottom: 20px; left: 20px; background: #57F287; color: #000; padding: 12px 20px; border-radius: 8px; font-weight: bold; display: none; }
  .toast.err { background: #ED4245; color: #fff; }
</style>
</head>
<body>
<div class="container">
  <h1>🤖 لوحة تحكم البوت</h1>
  <div id="app"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = 'https://dis-bot-qf91.onrender.com';

const state = { token: null, user: null, guilds: [], currentGuild: null, config: null, channels: [], roles: [] };

const urlParams = new URLSearchParams(location.search);
if (urlParams.get('token')) {
  localStorage.setItem('token', urlParams.get('token'));
  history.replaceState({}, '', location.pathname);
}
state.token = localStorage.getItem('token');

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + state.token, ...(opts.headers || {}) },
  });
  if (!res.ok) throw new Error((await res.json()).error || 'خطأ');
  return res.json();
}

function toast(msg, err = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (err ? ' err' : '');
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

async function init() {
  if (!state.token) return renderLogin();
  try {
    state.user = await api('/api/me');
    state.guilds = await api('/api/guilds');
    renderGuilds();
  } catch {
    localStorage.removeItem('token');
    renderLogin();
  }
}

function renderLogin() {
  document.getElementById('app').innerHTML = `
    <div class="card center">
      <h2>سجل دخول بحساب Discord</h2>
      <p style="color:#9aa0b0">لإدارة البوت في سيرفراتك</p>
      <a href="${API}/auth/login"><button style="font-size:17px;padding:15px 30px">🎮 تسجيل الدخول</button></a>
    </div>`;
}

function renderGuilds() {
  const list = state.guilds.map(g => `
    <div class="guild-card" onclick="openGuild('${g.id}')">
      <img class="guild-icon" src="${g.icon || 'https://cdn.discordapp.com/embed/avatars/0.png'}">
      <div style="flex:1">
        <div style="font-weight:bold">${g.name}</div>
        <div style="color:#9aa0b0;font-size:13px">${g.members} عضو</div>
      </div>
    </div>`).join('') || '<p style="color:#9aa0b0">ما عندك سيرفرات تديرها</p>';

  document.getElementById('app').innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b>👋 أهلاً ${state.user.username}</b>
        <button class="sec" onclick="logout()">خروج</button>
      </div>
    </div>
    <div class="card">
      <h3>📋 سيرفراتك (${state.guilds.length})</h3>
      ${list}
    </div>`;
}

async function openGuild(id) {
  try {
    const data = await api('/api/guild/' + id);
    state.currentGuild = state.guilds.find(g => g.id === id);
    state.config = data.config;
    state.channels = data.channels;
    state.roles = data.roles;
    renderGuild();
  } catch (e) { toast(e.message, true); }
}

function renderGuild() {
  document.getElementById('app').innerHTML = `
    <div class="card">
      <button class="sec" onclick="renderGuilds()">⬅️ رجوع</button>
      <h2 style="margin:15px 0">${state.currentGuild.name}</h2>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('welcome',this)">👋 الترحيب</button>
      <button class="tab" onclick="switchTab('goodbye',this)">👋 الوداع</button>
      <button class="tab" onclick="switchTab('logs',this)">📋 اللوقات</button>
      <button class="tab" onclick="switchTab('announce',this)">📢 إعلان</button>
      <button class="tab" onclick="switchTab('warnings',this)">⚠️ التحذيرات</button>
      <button class="tab" onclick="switchTab('commands',this)">⚙️ الأوامر</button>
    </div>
    <div id="tab-content"></div>`;
  switchTab('welcome');
}

function switchTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (btn) btn.classList.add('active');

  const c = state.config;
  const chOpts = (sel) => `<option value="">بدون</option>` + state.channels.map(ch =>
    `<option value="${ch.id}" ${sel === ch.id ? 'selected' : ''}>#${ch.name}</option>`).join('');
  const roleOpts = (sel) => `<option value="">بدون</option>` + state.roles.map(r =>
    `<option value="${r.id}" ${sel === r.id ? 'selected' : ''}>${r.name}</option>`).join('');

  let html = '';
  if (name === 'welcome') html = `
    <div class="card">
      <label class="switch"><input type="checkbox" id="welcomeEnabled" ${c.welcomeEnabled?'checked':''}> تفعيل الترحيب</label>
      <label>قناة الترحيب</label>
      <select id="welcomeChannel">${chOpts(c.welcomeChannel)}</select>
      <label>رسالة الترحيب</label>
      <textarea id="welcomeMessage">${c.welcomeMessage}</textarea>
      <p style="color:#9aa0b0;font-size:13px">متغيرات: <code>{user}</code> <code>{server}</code> <code>{count}</code></p>
      <label>رول تلقائي للأعضاء الجدد</label>
      <select id="autoRole">${roleOpts(c.autoRole)}</select>
      <br><br><button onclick="save()">💾 حفظ</button>
    </div>`;
  else if (name === 'goodbye') html = `
    <div class="card">
      <label class="switch"><input type="checkbox" id="goodbyeEnabled" ${c.goodbyeEnabled?'checked':''}> تفعيل الوداع</label>
      <label>قناة الوداع</label>
      <select id="goodbyeChannel">${chOpts(c.goodbyeChannel)}</select>
      <label>رسالة الوداع</label>
      <textarea id="goodbyeMessage">${c.goodbyeMessage}</textarea>
      <p style="color:#9aa0b0;font-size:13px">متغيرات: <code>{user}</code> <code>{server}</code></p>
      <br><button onclick="save()">💾 حفظ</button>
    </div>`;
  else if (name === 'logs') html = `
    <div class="card">
      <label>قناة اللوقات</label>
      <select id="logChannel">${chOpts(c.logChannel)}</select>
      <br><br><button onclick="save()">💾 حفظ</button>
    </div>`;
  else if (name === 'announce') html = `
    <div class="card">
      <label>القناة</label>
      <select id="annCh">${chOpts()}</select>
      <label>العنوان</label>
      <input id="annTitle" placeholder="عنوان الإعلان">
      <label>المحتوى</label>
      <textarea id="annDesc" placeholder="نص الإعلان..."></textarea>
      <label>اللون</label>
      <input id="annColor" type="color" value="#5865F2" style="height:50px">
      <br><br><button onclick="sendAnnounce()">📢 إرسال</button>
    </div>`;
  else if (name === 'warnings') { html = `
    <div class="card">
      <h3>⚠️ سجل التحذيرات</h3>
      <div id="warnsBox">جاري التحميل...</div>
    </div>`; setTimeout(loadWarnings, 50); }
  else if (name === 'commands') {
    const all = ['ping','serverinfo','userinfo','avatar','kick','ban','unban','timeout','warn','warnings','clear','8ball','dice','coinflip','poll','say'];
    html = `
      <div class="card">
        <h3>⚙️ تفعيل/تعطيل الأوامر</h3>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px">
          ${all.map(cmd => `
            <label class="switch">
              <input type="checkbox" data-cmd="${cmd}" ${!c.disabledCommands?.includes(cmd)?'checked':''}>
              /${cmd}
            </label>`).join('')}
        </div>
        <br><button onclick="saveCommands()">💾 حفظ</button>
      </div>`;
  }
  document.getElementById('tab-content').innerHTML = html;
}

async function save() {
  const updates = {};
  const ids = ['welcomeEnabled','welcomeChannel','welcomeMessage','goodbyeEnabled','goodbyeChannel','goodbyeMessage','logChannel','autoRole'];
  for (const id of ids) {
    const el = document.getElementById(id);
    if (!el) continue;
    updates[id] = el.type === 'checkbox' ? el.checked : (el.value || null);
  }
  try {
    state.config = await api('/api/guild/' + state.currentGuild.id, { method: 'PATCH', body: JSON.stringify(updates) });
    toast('✅ تم الحفظ');
  } catch (e) { toast(e.message, true); }
}

async function saveCommands() {
  const disabled = [];
  document.querySelectorAll('#tab-content input[data-cmd]').forEach(inp => {
    if (!inp.checked) disabled.push(inp.dataset.cmd);
  });
  try {
    state.config = await api('/api/guild/' + state.currentGuild.id, { method: 'PATCH', body: JSON.stringify({ disabledCommands: disabled }) });
    toast('✅ تم الحفظ');
  } catch (e) { toast(e.message, true); }
}

async function sendAnnounce() {
  const body = {
    channelId: document.getElementById('annCh').value,
    title: document.getElementById('annTitle').value,
    description: document.getElementById('annDesc').value,
    color: parseInt(document.getElementById('annColor').value.replace('#',''), 16),
  };
  try {
    await api('/api/guild/' + state.currentGuild.id + '/announce', { method: 'POST', body: JSON.stringify(body) });
    toast('✅ تم الإرسال');
  } catch (e) { toast(e.message, true); }
}

async function loadWarnings() {
  try {
    const warns = await api('/api/guild/' + state.currentGuild.id + '/warnings');
    const box = document.getElementById('warnsBox');
    if (!warns.length) return box.innerHTML = '<p style="color:#9aa0b0">ما في تحذيرات</p>';
    box.innerHTML = warns.map(w => `
      <div style="background:#252938;padding:12px;border-radius:8px;margin:8px 0;display:flex;justify-content:space-between;align-items:center">
        <div>
          <div><b>@${w.userId}</b> — ${w.reason}</div>
          <div style="color:#9aa0b0;font-size:13px">بواسطة @${w.moderatorId} — ${new Date(w.createdAt).toLocaleString('ar')}</div>
        </div>
        <button class="danger" onclick="delWarn('${w._id}')">🗑️</button>
      </div>`).join('');
  } catch (e) { toast(e.message, true); }
}

async function delWarn(id) {
  try {
    await api('/api/guild/' + state.currentGuild.id + '/warnings/' + id, { method: 'DELETE' });
    toast('✅ تم الحذف');
    loadWarnings();
  } catch (e) { toast(e.message, true); }
}

function logout() { localStorage.removeItem('token'); location.reload(); }

init();
</script>
</body>
</html>
